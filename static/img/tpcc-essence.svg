<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640"
     role="img" aria-labelledby="tpcc-title tpcc-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="tpcc-title">The essence of TPC-C: most of the load lands on a handful of district rows</title>
  <desc id="tpcc-desc">Left: the schema hierarchy with what scales with the warehouse count. Right: the
  transaction mix, and the rows each type writes — New-Order and Payment converge on the same district row,
  which is only ten rows per warehouse.</desc>

  <rect x="0" y="0" width="980" height="620" rx="14" fill="#1e1e1e"/>

  <!-- Panel A: the hierarchy -->
  <rect x="18" y="18" width="470" height="500" rx="10" fill="#272727" stroke="#353535"/>
  <text x="40" y="48" fill="#a0cbff" font-size="15" font-weight="600">What one warehouse holds</text>
  <text x="40" y="70" fill="#bdbdbd" font-size="12">W = warehouses; everything but item scales with W</text>

  <g font-size="13" fill="#bdbdbd">
    <rect x="44" y="90" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="112">warehouse</text>
    <text x="266" y="112" text-anchor="end" fill="#7cb4ff">W</text>

    <rect x="44" y="140" width="230" height="34" rx="6" fill="#1e1e1e" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="162" fill="#fbbf24">district</text>
    <text x="266" y="162" text-anchor="end" fill="#fbbf24">10 × W</text>

    <rect x="44" y="190" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="212">customer</text>
    <text x="266" y="212" text-anchor="end" fill="#7cb4ff">30,000 × W</text>

    <rect x="44" y="240" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="262">orders</text>
    <text x="266" y="262" text-anchor="end" fill="#7cb4ff">30,000 × W</text>

    <rect x="44" y="290" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="312">order_line</text>
    <text x="266" y="312" text-anchor="end" fill="#7cb4ff">300,000 × W</text>

    <rect x="44" y="352" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="374">stock</text>
    <text x="266" y="374" text-anchor="end" fill="#7cb4ff">100,000 × W</text>

    <rect x="44" y="402" width="230" height="34" rx="6" fill="#2d2d2d" stroke="#353535"/>
    <text x="60" y="424">item</text>
    <text x="266" y="424" text-anchor="end" fill="#7cb4ff">100,000, shared</text>
  </g>

  <text x="44" y="468" fill="#bdbdbd" font-size="12">Every transaction also appends to</text>
  <text x="44" y="486" fill="#bdbdbd" font-size="12">history or new_order, and the district carries</text>
  <text x="44" y="504" fill="#bdbdbd" font-size="12">the order counter that serializes the load.</text>

  <!-- Panel B: the mix and the rows it writes -->
  <rect x="510" y="18" width="452" height="500" rx="10" fill="#272727" stroke="#353535"/>
  <text x="532" y="48" fill="#a0cbff" font-size="15" font-weight="600">Where the mix lands</text>
  <text x="532" y="70" fill="#bdbdbd" font-size="12">share of transactions, and the rows each one writes</text>

  <g font-size="12">
    <!-- New-Order 45% -->
    <text x="532" y="104" fill="#bdbdbd">New-Order</text>
    <rect x="620" y="92" width="180" height="16" rx="3" fill="#2d2d2d"/>
    <rect x="620" y="92" width="81" height="16" rx="3" fill="#5fa0ff"/>
    <text x="812" y="104" fill="#a0cbff">45%</text>

    <!-- Payment 43% -->
    <text x="532" y="130" fill="#bdbdbd">Payment</text>
    <rect x="620" y="118" width="180" height="16" rx="3" fill="#2d2d2d"/>
    <rect x="620" y="118" width="77" height="16" rx="3" fill="#5fa0ff"/>
    <text x="812" y="130" fill="#a0cbff">43%</text>

    <!-- the three small ones -->
    <text x="532" y="156" fill="#bdbdbd">Order-Status</text>
    <rect x="620" y="144" width="180" height="16" rx="3" fill="#2d2d2d"/>
    <rect x="620" y="144" width="7" height="16" rx="3" fill="#4284fb"/>
    <text x="812" y="156" fill="#7cb4ff">4%</text>

    <text x="532" y="182" fill="#bdbdbd">Delivery</text>
    <rect x="620" y="170" width="180" height="16" rx="3" fill="#2d2d2d"/>
    <rect x="620" y="170" width="7" height="16" rx="3" fill="#4284fb"/>
    <text x="812" y="182" fill="#7cb4ff">4%</text>

    <text x="532" y="208" fill="#bdbdbd">Stock-Level</text>
    <rect x="620" y="196" width="180" height="16" rx="3" fill="#2d2d2d"/>
    <rect x="620" y="196" width="7" height="16" rx="3" fill="#4284fb"/>
    <text x="812" y="208" fill="#7cb4ff">4%</text>
  </g>

  <!-- converge on the district row -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow-amber)">
    <path d="M872 100 C 902 200 900 236 800 262"/>
    <path d="M872 126 C 902 200 900 232 800 262"/>
  </g>
  <g stroke="#5fa0ff" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M872 152 C 906 240 904 300 794 330"/>
    <path d="M872 178 C 910 260 908 330 790 356"/>
    <path d="M872 204 C 914 290 912 360 800 404"/>
  </g>

  <rect x="536" y="262" width="180" height="34" rx="6" fill="#1e1e1e" stroke="#f59e0b" stroke-width="2"/>
  <text x="626" y="284" text-anchor="middle" fill="#fbbf24">district (10 × W)</text>
  <rect x="730" y="262" width="214" height="34" rx="6" fill="#1e1e1e" stroke="#f59e0b" stroke-width="2"/>
  <text x="837" y="284" text-anchor="middle" fill="#fde68a" font-size="12">88% of all transactions</text>

  <text x="536" y="336" fill="#7cb4ff" font-size="12">stock rows (New-Order, per item)</text>
  <text x="536" y="358" fill="#7cb4ff" font-size="12">oldest new_order (Delivery, per district)</text>
  <text x="536" y="410" fill="#bdbdbd" font-size="12">Order-Status and Stock-Level read only — and</text>
  <text x="536" y="428" fill="#bdbdbd" font-size="12">Stock-Level reads that same district row, which</text>
  <text x="536" y="446" fill="#bdbdbd" font-size="12">is another reason 92% of this workload is writes.</text>

  <text x="536" y="470" fill="#a0cbff" font-size="13" font-weight="600">The essence</text>
  <text x="536" y="490" fill="#bdbdbd" font-size="12">Ten rows per warehouse take almost all the</text>
  <text x="536" y="506" fill="#bdbdbd" font-size="12">write traffic, so throughput is decided by how</text>
  <text x="536" y="522" fill="#bdbdbd" font-size="12">fast those rows can be updated in turn.</text>
  <!-- the footer line -->
  <rect x="18" y="534" width="944" height="88" rx="8" fill="#1e1e1e" stroke="#4284fb" stroke-dasharray="4 3"/>
  <text x="40" y="560" fill="#a0cbff" font-size="13" font-weight="600">A rollback is part of the mix</text>
  <text x="40" y="584" fill="#bdbdbd" font-size="12">New-Order rolls back when an item is not found: a required part of the mix, not a fault. The workload</text>
  <text x="40" y="604" fill="#bdbdbd" font-size="12">counts it separately from real failures, so a run&#8217;s error counters stay readable.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fa0ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
