<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="50%" style="stop-color:#272727"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4284fb"/>
      <stop offset="50%" style="stop-color:#5fa0ff"/>
      <stop offset="100%" style="stop-color:#4284fb"/>
    </linearGradient>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rimGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Database cylinder body -->
  <ellipse cx="100" cy="60" rx="65" ry="22" fill="url(#bgGrad)" opacity="0.95"/>
  <rect x="35" y="60" width="130" height="80" fill="url(#bgGrad)" opacity="0.9"/>
  <ellipse cx="100" cy="140" rx="65" ry="22" fill="url(#bgGrad)" opacity="0.95"/>

  <!-- Middle ring with glow -->
  <ellipse cx="100" cy="100" rx="65" ry="22" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" opacity="0.5" filter="url(#rimGlow)"/>

  <!-- Top ellipse highlight with glow -->
  <ellipse cx="100" cy="60" rx="65" ry="22" fill="none" stroke="#7cb4ff" stroke-width="2" filter="url(#rimGlow)"/>
  <ellipse cx="100" cy="60" rx="55" ry="16" fill="#353535" opacity="0.6"/>

  <!-- Bottom ellipse subtle ring -->
  <ellipse cx="100" cy="140" rx="65" ry="22" fill="none" stroke="#5fa0ff" stroke-width="1" opacity="0.3"/>

  <!-- Lightning bolt with glow -->
  <polygon points="110,45 88,102 105,102 90,155 130,92 112,92 128,45" fill="url(#boltGrad)" stroke="#fde68a" stroke-width="0.5" stroke-linejoin="round" filter="url(#boltGlow)"/>
</svg>
